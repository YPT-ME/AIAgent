# Port 80: Serves /var/www/html for Let's Encrypt SSL challenge and redirects to HTTPS
<VirtualHost *:80>
    ServerName avideoagent.ypt.me
    
    DocumentRoot /var/www/html
    
    # Allow Let's Encrypt challenge
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    
    # Redirect all traffic to HTTPS except Let's Encrypt challenges
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/ [NC]
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# Port 443: SSL with proxy to Next.js Chat UI
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName avideoagent.ypt.me
    
    SSLEngine On
    SSLProxyEngine On
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off

    ProxyPreserveHost On
    
    # Proxy to Agent Chat UI (Next.js) on port 3001
    ProxyPass "/" "http://127.0.0.1:3001/"
    ProxyPassReverse "/" "http://127.0.0.1:3001/"

    # Headers for WebSocket and Next.js
    RequestHeader set X-Forwarded-Proto https
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    RequestHeader set X-Real-IP %{REMOTE_ADDR}s
    
    # Higher timeout for WebSocket connections
    ProxyTimeout 300
    
    SSLCertificateFile /etc/letsencrypt/live/avideoagent.ypt.me/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/avideoagent.ypt.me/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
