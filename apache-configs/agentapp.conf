# Port 80: Serves /var/www/html for Let's Encrypt SSL challenge
# After certbot runs, port 443 SSL config will be added automatically
<VirtualHost *:80>
    ServerName avideoagent.ypt.me
    
    DocumentRoot /var/www/html
    
    # Allow Let's Encrypt challenge
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    
    # Proxy configuration (will be moved to port 443 by certbot)
    ProxyPreserveHost On
    
    # Proxy to Agent Chat UI (Next.js) on port 3001
    ProxyPass "/" "http://127.0.0.1:3001/"
    ProxyPassReverse "/" "http://127.0.0.1:3001/"

    # Headers for WebSocket and Next.js
    RequestHeader set X-Forwarded-Proto https
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    RequestHeader set X-Real-IP %{REMOTE_ADDR}s
    
    # Higher timeout for WebSocket connections
    ProxyTimeout 300
</VirtualHost>
