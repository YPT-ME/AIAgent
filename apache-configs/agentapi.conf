# Port 80: Serves /var/www/html for Let's Encrypt SSL challenge and redirects to HTTPS
<VirtualHost *:80>
    ServerName avideoagentapi.ypt.me
    
    DocumentRoot /var/www/html
    
    # Allow Let's Encrypt challenge
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    
    # Redirect all traffic to HTTPS except Let's Encrypt challenges
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/ [NC]
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# Port 443: SSL with proxy to LangGraph Server
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName avideoagentapi.ypt.me
    
    SSLEngine On
    SSLProxyEngine On
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off

    ProxyPreserveHost On
    
    # WebSocket support for LangGraph Server streaming
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:2024/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/(.*) http://127.0.0.1:2024/$1 [P,L]
    
    # Proxy to LangGraph Server on port 2024
    ProxyPass "/" "http://127.0.0.1:2024/"
    ProxyPassReverse "/" "http://127.0.0.1:2024/"

    # Required headers for WebSocket and proxy
    RequestHeader set X-Forwarded-Proto https
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
    RequestHeader set X-Real-IP %{REMOTE_ADDR}s
    
    # Higher timeout for streaming and WebSocket
    ProxyTimeout 600
    
    SSLCertificateFile /etc/letsencrypt/live/avideoagentapi.ypt.me/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/avideoagentapi.ypt.me/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
